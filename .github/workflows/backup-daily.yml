name: Backup cifrado diario

on:
  schedule:
    # 04:00 America/Bogota; GitHub cron siempre usa UTC.
    - cron: '0 9 * * *'
  workflow_dispatch:

concurrency:
  group: backup-daily
  cancel-in-progress: false

jobs:
  backup:
    uses: ./.github/workflows/backup-logical.yml
    with:
      cadence: daily
      retention_days: 7
      scope: data
    secrets: inherit
