name: Backup cifrado semanal

on:
  schedule:
    # Domingo 04:30 America/Bogota; GitHub cron siempre usa UTC.
    - cron: '30 9 * * 0'
  workflow_dispatch:

concurrency:
  group: backup-weekly
  cancel-in-progress: false

jobs:
  backup:
    uses: ./.github/workflows/backup-logical.yml
    with:
      cadence: weekly
      retention_days: 28
      scope: full
    secrets: inherit
