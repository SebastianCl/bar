name: E2E de preview

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-preview
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: preview
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Validar configuración E2E estricta
        shell: bash
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_ADMIN_USERNAME: ${{ secrets.E2E_ADMIN_USERNAME }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          for variable in VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY E2E_USERNAME E2E_PASSWORD E2E_ADMIN_USERNAME E2E_ADMIN_PASSWORD; do
            test -n "${!variable}" || { echo "::error::Falta $variable en el Environment preview"; exit 1; }
          done
          [[ "$VITE_SUPABASE_PUBLISHABLE_KEY" == sb_publishable_* ]] || {
            echo "::error::VITE_SUPABASE_PUBLISHABLE_KEY debe comenzar por sb_publishable_"
            exit 1
          }

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Instalar Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Ejecutar flujos E2E
        run: pnpm e2e
        env:
          CI: 'true'
          E2E_REQUIRE_ENV: '1'
          PLAYWRIGHT_BASE_URL: ${{ vars.PLAYWRIGHT_BASE_URL }}
          VITE_APP_ENV: preview
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_ADMIN_USERNAME: ${{ secrets.E2E_ADMIN_USERNAME }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}

      - name: Publicar reporte si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 7
