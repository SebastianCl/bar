name: Backup cifrado mensual para archivo externo

on:
  schedule:
    # Primer día del mes, 05:00 America/Bogota.
    - cron: '0 10 1 * *'
  workflow_dispatch:

concurrency:
  group: backup-monthly
  cancel-in-progress: false

jobs:
  backup:
    uses: ./.github/workflows/backup-logical.yml
    with:
      cadence: monthly
      retention_days: 90
      scope: full
    secrets: inherit
