name: Backup completo posterior a migración

on:
  # Ejecutar manualmente solo después de `supabase db push` exitoso en producción.
  workflow_dispatch:

concurrency:
  group: backup-after-migration
  cancel-in-progress: false

jobs:
  backup:
    uses: ./.github/workflows/backup-logical.yml
    with:
      cadence: migration
      retention_days: 28
      scope: full
    secrets: inherit
